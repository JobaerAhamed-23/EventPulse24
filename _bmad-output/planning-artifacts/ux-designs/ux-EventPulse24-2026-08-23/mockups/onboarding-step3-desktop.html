<!--
  EventPulse24 — Onboarding Step 3 of 3 (Desktop) — DARK THEME
  Daily digest delivery time + timezone.
-->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EventPulse24 — When should we ping you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-paper:#0A0A0B; --surface-elevated:#131316; --surface-subtle:#1B1B1F; --surface-inset:#232328;
    --ink-primary:#F2F2F4; --ink-secondary:#C9C9CF; --ink-muted:#8A8A92; --ink-faint:#3A3A40; --ink-inverse:#0A0A0B;
    --accent-terracotta:#FF6A47; --accent-amber:#E89B4A;
    --border-subtle:rgba(242,242,244,0.08); --border-strong:rgba(242,242,244,0.16);
    --family-display:"Source Serif 4",Fraunces,Georgia,serif;
    --family-body:"Inter",-apple-system,system-ui,sans-serif;
    --family-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; background: var(--surface-paper); color: var(--ink-primary); font-family: var(--family-body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; background: none; border: 0; }

  .frame { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 24px 80px; border-bottom: 1px solid var(--border-subtle); }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--family-display); font-size: 18px; font-weight: 600; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-terracotta); box-shadow: 0 0 12px rgba(255,106,71,0.55); }
  .skip-all { color: var(--ink-muted); font-size: 13px; font-weight: 500; }

  .container { flex: 1; max-width: 720px; margin: 0 auto; padding: 64px 24px 48px; width: 100%; }
  .steps { display: flex; gap: 8px; margin-bottom: 48px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--accent-terracotta); }

  .step-label { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; margin-bottom: 12px; }
  h1 { font-family: var(--family-display); font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; color: var(--ink-primary); }
  .lede { font-size: 16px; line-height: 1.55; color: var(--ink-secondary); margin: 0 0 32px; }

  .field { margin-bottom: 24px; }
  .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-secondary); margin-bottom: 8px; letter-spacing: 0.02em; }
  .time-picker { display: flex; align-items: center; gap: 8px; }
  .time-input { background: var(--surface-elevated); border: 1px solid var(--border-subtle); padding: 16px 18px; border-radius: 10px; font-family: var(--family-mono); font-size: 24px; font-weight: 600; color: var(--ink-primary); width: 100px; text-align: center; }
  .time-input:focus { outline: 2px solid var(--accent-terracotta); outline-offset: 1px; border-color: var(--accent-terracotta); }
  .time-colon { font-family: var(--family-mono); font-size: 24px; color: var(--ink-muted); }
  .time-ampm { display: flex; flex-direction: column; gap: 4px; }
  .ampm { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-secondary); background: var(--surface-elevated); border: 1px solid var(--border-subtle); }
  .ampm.active { background: var(--accent-terracotta); color: var(--ink-inverse); border-color: var(--accent-terracotta); }

  .tz-input { width: 100%; background: var(--surface-elevated); border: 1px solid var(--border-subtle); padding: 16px 18px; border-radius: 10px; font-size: 15px; color: var(--ink-primary); }
  .tz-input:focus { outline: 2px solid var(--accent-terracotta); outline-offset: 1px; }
  .field-hint { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }

  .presets { display: flex; gap: 8px; margin-bottom: 32px; }
  .preset { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-secondary); background: var(--surface-elevated); border: 1px solid var(--border-subtle); }
  .preset:hover { background: var(--surface-subtle); }
  .preset.active { background: rgba(255,106,71,0.10); color: var(--accent-terracotta); border-color: rgba(255,106,71,0.30); }

  .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
  .skip-link { color: var(--ink-muted); font-size: 14px; font-weight: 500; padding: 10px 16px; }
  .btn-primary { background: var(--accent-terracotta); color: var(--ink-inverse); padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .btn-primary:hover { background: #FF7E5E; }
</style>
</head>
<body>
<div class="frame">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> EventPulse24</div>
    <button class="skip-all">Skip — take me to my brief →</button>
  </header>
  <main class="container">
    <div class="steps">
      <div class="step"></div>
      <div class="step"></div>
      <div class="step"></div>
    </div>
    <div class="step-label">Step 3 of 3 · Optional</div>
    <h1>When should we ping you?</h1>
    <p class="lede">One calm Pulse Ping per day. It links to your brief. You can change this anytime — and quiet hours come later in Settings.</p>

    <div class="field">
      <label class="field-label" for="t">Pulse Digest delivery time</label>
      <div class="time-picker">
        <input class="time-input" id="t" value="08" aria-label="Hour" />
        <span class="time-colon">:</span>
        <input class="time-input" value="00" aria-label="Minute" />
        <div class="time-ampm">
          <button class="ampm active">AM</button>
          <button class="ampm">PM</button>
        </div>
      </div>
      <div class="presets" style="margin-top: 14px;">
        <button class="preset active">8:00 AM</button>
        <button class="preset">7:00 AM</button>
        <button class="preset">9:00 AM</button>
        <button class="preset">12:00 PM</button>
        <button class="preset">6:00 PM</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="tz">Timezone</label>
      <input class="tz-input" id="tz" value="America/New_York (EDT) — auto-detected" />
      <div class="field-hint">If you travel, we'll switch this for you — confirmed by your device, not silently.</div>
    </div>

    <div class="footer-actions">
      <button class="skip-link">← Back</button>
      <button class="btn-primary">Open my brief →</button>
    </div>
  </main>
</div>
</body>
</html>

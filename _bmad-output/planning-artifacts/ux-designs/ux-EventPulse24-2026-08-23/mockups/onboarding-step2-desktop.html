<!--
  EventPulse24 — Onboarding Step 2 of 3 (Desktop) — DARK THEME
  Interest chips (3 picks, optional).
-->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EventPulse24 — Pick what you like</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-paper:#0A0A0B; --surface-elevated:#131316; --surface-subtle:#1B1B1F; --surface-inset:#232328;
    --ink-primary:#F2F2F4; --ink-secondary:#C9C9CF; --ink-muted:#8A8A92; --ink-faint:#3A3A40; --ink-inverse:#0A0A0B;
    --accent-terracotta:#FF6A47; --accent-slate:#6E7E92; --accent-amber:#E89B4A;
    --border-subtle:rgba(242,242,244,0.08); --border-strong:rgba(242,242,244,0.16);
    --family-display:"Source Serif 4",Fraunces,Georgia,serif;
    --family-body:"Inter",-apple-system,system-ui,sans-serif;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; background: var(--surface-paper); color: var(--ink-primary); font-family: var(--family-body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .frame { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 24px 80px; border-bottom: 1px solid var(--border-subtle); }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--family-display); font-size: 18px; font-weight: 600; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-terracotta); box-shadow: 0 0 12px rgba(255,106,71,0.55); }
  .skip-all { color: var(--ink-muted); font-size: 13px; font-weight: 500; }
  .skip-all:hover { color: var(--ink-secondary); }

  .container { flex: 1; max-width: 720px; margin: 0 auto; padding: 64px 24px 48px; width: 100%; }
  .steps { display: flex; gap: 8px; margin-bottom: 56px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--ink-primary); }
  .step.pending { background: var(--surface-inset); }

  h1 { font-family: var(--family-display); font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; color: var(--ink-primary); }
  .lede { font-size: 16px; line-height: 1.55; color: var(--ink-secondary); margin: 0 0 32px; }

  /* DESIGN §Components.input.chip: subtle fill, secondary ink, 6px radius. */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
  .chip { padding: 10px 14px; border-radius: 6px; border: 1px solid transparent; font-size: 14px; color: var(--ink-secondary); background: var(--surface-subtle); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: background 160ms ease, color 160ms ease, border-color 160ms ease; }
  .chip:hover { background: var(--surface-inset); color: var(--ink-primary); }
  .chip:focus-visible { outline: 2px solid var(--accent-terracotta); outline-offset: 2px; }
  /* DESIGN §Components.input.chip selection: tint + label color shift, no terracotta border. */
  .chip.selected { background: rgba(255,106,71,0.10); color: var(--accent-terracotta); border-color: transparent; }
  .chip .glyph { width: 14px; height: 14px; opacity: 0.8; }

  .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
  .skip-link { color: var(--ink-muted); font-size: 14px; font-weight: 500; padding: 10px 16px; }
  .skip-link:hover { color: var(--ink-secondary); }
  .btn-primary { background: var(--accent-terracotta); color: var(--ink-inverse); padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: background 160ms ease; }
  .btn-primary:disabled { background: var(--surface-inset); color: var(--ink-muted); cursor: not-allowed; }
  .btn-primary:hover:not(:disabled) { background: #FF7E5E; }
  .btn-primary:focus-visible { outline: 2px solid var(--accent-terracotta); outline-offset: 2px; }
</style>
</head>
<body>
<div class="frame">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> EventPulse24</div>
    <button class="skip-all">Skip — take me to my brief →</button>
  </header>
  <main class="container">
    <div class="steps">
      <div class="step"></div>
      <div class="step"></div>
      <div class="step pending"></div>
    </div>
    <h1>What kinds of things?</h1>
    <p class="lede">Pick up to three. We'll bias your brief toward them — and your serendipity slot toward something <em>else</em>. Skip and we'll learn from your first week instead.</p>

    <div class="chips">
      <button class="chip selected">
        Music
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 7"/></svg>
      </button>
      <button class="chip">Tech &amp; meetups</button>
      <button class="chip selected">
        Food &amp; dining
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 7"/></svg>
      </button>
      <button class="chip">Sports &amp; fitness</button>
      <button class="chip">Arts &amp; culture</button>
      <button class="chip">Family &amp; kids</button>
      <button class="chip">Community &amp; volunteering</button>
      <button class="chip">Outdoors &amp; nature</button>
      <button class="chip">Classes &amp; workshops</button>
      <button class="chip">Markets &amp; fairs</button>
      <button class="chip">Talks &amp; lectures</button>
      <button class="chip">Government &amp; civic</button>
    </div>

    <div class="footer-actions">
      <button class="skip-link">← Back</button>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button class="skip-link">Skip for now</button>
        <button class="btn-primary">Continue</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>

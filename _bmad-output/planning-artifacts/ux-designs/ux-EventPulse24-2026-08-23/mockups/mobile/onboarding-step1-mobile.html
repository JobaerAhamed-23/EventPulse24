<!--
  EventPulse24 — Onboarding Step 1 of 3 (Mobile, 375px) — DARK THEME
-->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EventPulse24 — Connect your calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-paper:#0A0A0B; --surface-elevated:#131316; --surface-subtle:#1B1B1F; --surface-inset:#232328;
    --ink-primary:#F2F2F4; --ink-secondary:#C9C9CF; --ink-muted:#8A8A92; --ink-faint:#3A3A40; --ink-inverse:#0A0A0B;
    --accent-terracotta:#FF6A47;
    --border-subtle:rgba(242,242,244,0.08);
    --family-display:"Source Serif 4",Fraunces,Georgia,serif;
    --family-body:"Inter",-apple-system,system-ui,sans-serif;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; background: var(--surface-paper); color: var(--ink-primary); font-family: var(--family-body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .shell { max-width: 420px; margin: 0 auto; min-height: 100vh; padding: 0 20px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 8px; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--family-display); font-size: 16px; font-weight: 600; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-terracotta); box-shadow: 0 0 10px rgba(255,106,71,0.6); }
  .skip-all { color: var(--ink-muted); font-size: 12px; font-weight: 500; }

  .steps { display: flex; gap: 6px; margin: 16px 0 24px; }
  .step { flex: 1; height: 3px; border-radius: 2px; background: var(--surface-inset); }
  .step.current { background: var(--accent-terracotta); }

  .step-label { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
  h1 { font-family: var(--family-display); font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 10px; color: var(--ink-primary); }
  .lede { font-size: 14px; line-height: 1.55; color: var(--ink-secondary); margin: 0 0 24px; }

  .providers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .provider { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface-elevated); cursor: pointer; }
  .provider .logo { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-inset); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--ink-secondary); }
  .provider strong { display: block; font-size: 14px; font-weight: 600; color: var(--ink-primary); margin-bottom: 2px; }
  .provider span { font-size: 12px; color: var(--ink-muted); }
  .provider .body { flex: 1; }
  .provider .arrow { color: var(--ink-muted); }

  .privacy { display: flex; gap: 10px; padding: 12px 14px; background: var(--surface-subtle); border-radius: 10px; font-size: 12px; color: var(--ink-secondary); line-height: 1.5; margin-bottom: 24px; }
  .privacy .glyph { color: var(--accent-terracotta); }

  .btn-primary { background: var(--accent-terracotta); color: var(--ink-inverse); padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600; width: 100%; }
  .skip-link { color: var(--ink-muted); font-size: 13px; font-weight: 500; display: block; text-align: center; margin-top: 12px; }

  body { padding-bottom: 24px; }
</style>
</head>
<body>
<div class="shell">
  <nav class="topbar">
    <div class="brand"><span class="dot"></span> EventPulse24</div>
    <button class="skip-all">Skip →</button>
  </nav>

  <div class="steps">
    <div class="step current"></div><div class="step"></div><div class="step"></div>
  </div>

  <div class="step-label">Step 1 of 3 · Optional</div>
  <h1>Connect a calendar?</h1>
  <p class="lede">We'll show your personal events alongside public ones. Read-only. Disconnect anytime.</p>

  <div class="providers">
    <button class="provider">
      <span class="logo">G</span>
      <span class="body"><strong>Google Calendar</strong><span>1-click OAuth</span></span>
      <span class="arrow">→</span>
    </button>
    <button class="provider">
      <span class="logo"></span>
      <span class="body"><strong>Apple Calendar</strong><span>Coming Phase 2</span></span>
      <span class="arrow">→</span>
    </button>
    <button class="provider">
      <span class="logo">O</span>
      <span class="body"><strong>Outlook</strong><span>Coming Phase 2</span></span>
      <span class="arrow">→</span>
    </button>
  </div>

  <div class="privacy">
    <span class="glyph">●</span>
    <span>Read-only access. We never write to your calendar.</span>
  </div>

  <button class="btn-primary">Continue →</button>
  <button class="skip-link">Skip for now</button>
</div>
</body>
</html>
